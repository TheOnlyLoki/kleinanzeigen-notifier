# Copy this file to config.yaml and adjust.
# config.yaml is gitignored (it can reveal your search location), so deploy
# it alongside .env - e.g. scp both to the Pi, or mount them as volumes.
# Telegram secrets never go in here - they live in .env.

watches:
  - name: "BMW E46"
    query: "BMW E46"
    category_id: 216         # Auto - excludes parts/accessories listings. See notifier/commands.py CATEGORY_LABELS for others, or add via chat with /add
    location: "12345"
    radius: 30               # km - allowed steps: 5,10,20,30,50,100,150,200
    min_price: 500
    max_price: 3500
    page_count: 1            # search result pages to scan per run
    interval_minutes: 15     # how often this watch is polled
    notify_on:
      - new_listing
      - price_drop
    # chat_id: "123456789"   # optional: override TELEGRAM_CHAT_ID for just this watch

  # Any search set up on kleinanzeigen.de itself, with all of the site's
  # filters for that category (here: VW, first registration from 2008,
  # automatic, estate/SUV). Copy the URL of the results page; when "url" is
  # set, query/category/location/radius/price above are not used.
  # Easiest from Telegram: just paste the URL into the chat with the bot.
  - name: "VW Kombi Automatik"
    url: "https://www.kleinanzeigen.de/s-autos/volkswagen/k0c216+autos.ez_i:2008%2C+autos.marke_s:volkswagen+autos.shift_s:automatik+autos.typ_s:(kombi%2Csuv)"
    interval_minutes: 15

  # Add more watches here, each with its own query/interval/chat_id.
